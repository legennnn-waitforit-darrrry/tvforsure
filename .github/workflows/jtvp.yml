name: StreamFlex JioTV+ API — Zio M3U Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  jiotvplus-api-fetch:
    name: Fetch JioTV+ API & Export Zio.m3u
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      JTVP_API_ENDPOINT: https://n1.cloudplay.qzz.io/app-auth22/url.php
      JTVP_KEY_BASE: cppremium
      JTVP_USERNAME: YW50bnUzODI4
      JTVP_PASSWORD: YW50bnVANzM4OA==
      JTVP_TOKEN: 4cf3b310b29430b4ee410a8041bf86b441cd289bf6bf538a60f0969ecc495828

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        run: |
          set -e

          [ -n "$JTVP_API_ENDPOINT" ] || { echo "::error::Missing API endpoint."; exit 1; }
          [ -n "$JTVP_USERNAME" ] || { echo "::error::Missing JTVP_USERNAME secret."; exit 1; }
          [ -n "$JTVP_PASSWORD" ] || { echo "::error::Missing JTVP_PASSWORD secret."; exit 1; }
          [ -n "$JTVP_TOKEN" ] || { echo "::error::Missing JTVP_TOKEN secret."; exit 1; }

          echo "Configuration validated."

      - name: Fetch Playlist
        run: |
          set -eo pipefail

          # Decode Base64 credentials automatically if encoded
          RAW_USER=$(echo "$JTVP_USERNAME" | base64 -d 2>/dev/null || echo "$JTVP_USERNAME")
          RAW_PASS=$(echo "$JTVP_PASSWORD" | base64 -d 2>/dev/null || echo "$JTVP_PASSWORD")

          echo "Connecting to JioTV+ API..."

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --location \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 30 \
              --get \
              --data-urlencode "username=${RAW_USER}" \
              --data-urlencode "password=${RAW_PASS}" \
              --data-urlencode "token=${JTVP_TOKEN}" \
              --data-urlencode "key_base=${JTVP_KEY_BASE}" \
              -o Zio.m3u \
              -w "%{http_code}" \
              "$JTVP_API_ENDPOINT"
          )

          echo "HTTP Status: $HTTP_STATUS"
          echo "JTVP_HTTP_STATUS=$HTTP_STATUS" >> "$GITHUB_ENV"

          echo "----- Server Response Preview -----"
          head -n 20 Zio.m3u || true
          echo "----------------------------------"

          # Verify HTTP 200 AND check if the response is actually an M3U playlist file
          if [ "$HTTP_STATUS" = "200" ] && grep -q "#EXTM3U" Zio.m3u; then
            echo "JTVP_API_SUCCESS=true" >> "$GITHUB_ENV"
            echo "Playlist downloaded successfully."
          else
            echo "JTVP_API_SUCCESS=false" >> "$GITHUB_ENV"
            echo "::warning::API request failed or response was invalid M3U content."
            echo "Api Error" > Zio.m3u
          fi

      - name: Commit Changes
        run: |
          git config user.name "jtvp-api-bot"
          git config user.email "jtvp-api-bot@users.noreply.github.com"

          git add Zio.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ "$JTVP_API_SUCCESS" = "true" ]; then
            git commit -m "chore(jtvp-api): update Zio.m3u [$TIMESTAMP]"
          else
            git commit -m "chore(jtvp-api): API error [$TIMESTAMP]"
          fi

          git push

      - name: Summary
        run: |
          echo "=============================="
          echo " StreamFlex JioTV+ API Sync"
          echo "=============================="
          echo "HTTP Status : $JTVP_HTTP_STATUS"
          echo "API Success : $JTVP_API_SUCCESS"
          echo "Output File : Zio.m3u"
          echo "Next Run    : ~1 hour"
          echo "=============================="
